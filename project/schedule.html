    <main>
        <section class="schedule">
            <h2>Schedule!</h2>
            <form action="thanks.html" method="get">
                <div>
                <label for="name">Your Name</label>
                <input type="text" name="name" id="name" required>
            </div>
            <label for="store">Store:</label>
            <select name="store" id="store" required>
                <option value="" disabled selected>Select a Store...</option>
            </select>
            <div>
                <label> Mobile Phone<input type="tel" name="phone" required autocomplete="tel" title="Enter your mobile number"></label>
            </div>
            <input type="submit" value="Schedule your appointment" id="submit">
            </form>
        </section>
        
    </main>
